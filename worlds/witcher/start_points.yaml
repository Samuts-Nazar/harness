    Сьомий день, пізня ніч, повний місяць. У Визімі зачинено віконниці, двері під засувами,
    діти в хатах. Біля кордегардії під палацом стоїть нічна варта; ніхто не сидить і ніхто не
    жартує. Ґеральт цієї ночі в палаці, не тут. Нічого з того, що буде далі, не обіцяє бути
    тихим, і ви опинилися в самому серці міста. Це небезпечний старт.
  situation: >-
    Глибока ніч, місяць майже круглий і надто яскравий. Усі віконниці у Визімі зачинені, на
    вулицях тихо, як у склепі, а в кордегардії біля палацу ніхто не сидить: сержант тримає
    руку на руків'ї, нічний вартовий не випускає ліхтаря, а молодий вартовий стискає спис
    так, що біліють пальці. У місті кажуть, що в такі ночі краще не ходити далі порога,
    і ніхто з вартових не сміється. Ви в кордегардії, до світанку ще далеко.

