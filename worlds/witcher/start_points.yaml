# Named canon start moments of the Witcher world, for game packages (`start: {canon: <id>}`).
# All are built by one code path (`builder: vizima`, harness/world/pilot.py `CanonStart`), so only
# moments the engine can set up are listed here. The texts are our own short summaries, never book
# text. Names in the forms of the Ukrainian translation (worlds/witcher/glossary.json).
#
# Fields: title, book, place (display), day, time ("HH:MM", the story clock: day 1 = the day the
# witcher arrives in Vizima), canon_place (canon store place id), map_place (Vizima map id from
# harness/world/places.py), here (canon people standing in the first scene), extras (seeded locals
# made by npcgen; those whose `home` is the map place stand in the first scene, the rest live
# elsewhere in the city), acquainted (pairs that know each other: slot or character id), who (the
# default company, for the card), geralt (where the canon has the witcher then), geralt_here (true:
# the canon brings him to this place within the hour), pitch (one line for the instruction),
# portraits (canon entity id -> portrait id of worlds/witcher/portraits: the people made at the
# start play it, and Geralt when the canon brings him in), summary (the longer card/instruction
# text), situation (the opening shown to the player; absent = the built-in text of situation A). Nothing in `situation` names a person the newcomer has not met.
#
# The general builder (`builder: canon`, outsider campaign D7) starts at any canon place, outside the
# Vizima map. Its extra fields: story_t (the story minute of the start in the canon store's clock;
# `day`/`time` are then the campaign clock, which starts at an ordinary day and keeps the store's
# offset, so canon events, `before` flashbacks included, come at their story time after the start),
# canon_db (the file name of its canon store, looked up next to the pilot store, in campaigns/canon
# or as $HARNESS_CANON_DB_<NAME>; absent = the Vizima pilot store), people (canon people made at the
# start: entity, home map place, goal; those in `here` stand in the first scene, the rest live at
# their home), places (the map of this start: id, name, note, to, links {place: minutes}; links name
# places listed earlier), canon_places (canon place entity -> map place id). `extras` may be empty.
# Without its canon store the people of `people` are made from their portraits (no canon events).

