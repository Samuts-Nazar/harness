# Named canon start moments of the Witcher world, for game packages (`start: {canon: <id>}`).
# All are built by one code path (`builder: vizima`, harness/world/pilot.py `CanonStart`), so only
# moments the engine can set up are listed here. The texts are our own short summaries, never book
# text. Names in the forms of the Ukrainian translation (worlds/witcher/glossary.json).
#
# Fields: title, book, place (display), day, time ("HH:MM", the story clock: day 1 = the day the
# witcher arrives in Vizima), canon_place (canon store place id), map_place (Vizima map id from
# harness/world/places.py), here (canon people standing in the first scene), extras (seeded locals
# made by npcgen; those whose `home` is the map place stand in the first scene, the rest live
# elsewhere in the city), acquainted (pairs that know each other: slot or character id), who (the
# default company, for the card), geralt (where the canon has the witcher then), geralt_here (true:
# the canon brings him to this place within the hour), pitch (one line for the instruction),
# summary (the longer card/instruction text), situation (the opening shown to the player; absent =
# the built-in text of situation A). Nothing in `situation` names a person the newcomer has not met.

