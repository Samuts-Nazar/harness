# Чародійка грає за власним портретом (worlds/witcher/portraits/yennefer_rinde.yaml).

version: 1
world: witcher
title: Йеннефер у Рінде
pitch: >-
  Ранок у Рінде. Ви незнайомець, що прийшов просити допомоги в чародійки, яка наймає кімнату в
  купецькому домі. Вона зайнята своїм і не любить, коли її турбують.

player:
  description: |
    Звичайна людина з Рінде, років тридцяти: тесля з передмістя, руки в мозолях і скалках.
    Читає по складах, магії ніколи зблизька не бачив, чародіїв трохи боїться.
    Має справу, з якою більше нема до кого йти, і кілька оренів, зібраних на неї.
  appearance: >-
    Середнього зросту, широкі плечі, коротко стрижене русяве волосся, латана свитка,
    на поясі шкіряна торба з інструментом.
  knows:
    - У Рінде кажуть, що в домі одного купця зупинилася чародійка і що бере вона дорого.
    - Міські райці не люблять чародіїв і хотіли б, щоб вона поїхала з міста.

start:
  place: Рінде, кімната чародійки в купецькому домі
  day: 1
  time: ранок
  situation: >-
    Ранок у Рінде. Горішня кімната купецького дому, просторна і задушлива: розкидане по кріслах
    вбрання, на столі флакони, мідна миска з водою, відчинене вікно на двір, звідки тягне
    гноєм і свіжим хлібом. Служниця впустила гостя, що прийшов просити про допомогу, і втекла,
    зачинивши двері. Чорнокоса жінка в білій сорочці стоїть біля вікна й крапля по краплі
    відмірює щось із темного флакона в келих. Гостя вона помітила, але не поспішає.
  who_is_here:
    - name: Йеннефер
      role: чародійка
      appearance: чорнокоса жінка в білій сорочці
      attitude: зайнята своїми справами, незнайомців не терпить, але цікавість у неї сильніша за роздратування
      goal: закінчити свою справу і дізнатися, чи варто гостеві допомагати і що з нього можна взяти
      knows_player: false
      portrait: yennefer_rinde

